<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASL Sign Check</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>ASL Sign Check</h1>
  <p>Sign this word:</p>
  <div id="word">...</div>

  <!-- How to do the sign: a video from videos/<word>.mp4 if there is one,
       otherwise a stick figure drawn from the example data (see js/demo.js). -->
  <p>How to sign it:</p>
  <video id="demo-video" muted loop playsinline hidden></video>
  <canvas id="demo" width="320" height="260"></canvas>

  <p>
    <button id="next">Next word</button>
    <button id="start" disabled>Start (3-2-1, then sign)</button>
    <label>Leniency <input id="leniency" type="number" step="0.25" min="0.25" max="3"></label>
  </p>

  <!-- Testing tools, only shown when the address ends with ?debug -->
  <p id="debug-tools" hidden>
    <label><input type="checkbox" id="wrong-on-purpose"> I signed it wrong on purpose</label>
    <button id="save" disabled>Save last attempt</button>
  </p>

  <div id="status"></div>

  <!-- The video is mirrored so it feels like a mirror; the tracked points are drawn on top. -->
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <p>Keep your head, shoulders and hands in view.</p>
  <div id="details"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
